; PHP settings for the Shop POS on the shop computer.
extension_dir = "ext"
extension = pdo_sqlite
extension = sqlite3
extension = mbstring
extension = gd
extension = curl
extension = openssl
extension = fileinfo

date.timezone = Africa/Nairobi
memory_limit = 512M
max_execution_time = 0
upload_max_filesize = 16M
post_max_size = 32M
display_errors = Off
log_errors = On
error_log = "../data/logs/php-errors.log"

; Stay logged in on the shop computer for a week.
session.save_path = "../data/sessions"
session.gc_maxlifetime = 604800
session.cookie_lifetime = 0

; For the one-time "import my shop from the website" (HTTPS).
curl.cainfo = "cacert.pem"
openssl.cafile = "cacert.pem"
